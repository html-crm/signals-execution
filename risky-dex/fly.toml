# Fly.io Configuration for RISKY-DEX Backend
# Run: flyctl launch --config fly.toml

app = "risky-dex-backend"
primary_region = "iad"  # US East (change to your region: lhr, sin, syd, etc.)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Health checks
  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# Release command - runs migrations before deploy
[deploy]
  release_command = "npm run prisma:migrate:deploy"

# VM sizing (free tier: shared-cpu-1x, 256MB)
[[vm]]
  size = "shared-cpu-1x"
  cpus = 1
  memory_mb = 256

# Mount for any persistent data (optional)
# [[mounts]]
#   source = "risky_dex_data"
#   destination = "/data"