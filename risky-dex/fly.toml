app = "risky-dex-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  context = "."

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# [deploy]
#   release_command = "npm run prisma:migrate:deploy"

[[vm]]
  size = "shared-cpu-1x"
  cpus = 1
  memory_mb = 256